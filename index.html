<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>자산 관리 앱</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #764ba2;
            --secondary-color: #667eea;
            --positive-color: #d32f2f;
            --negative-color: #1976d2;
            --text-primary: #212121;
            --text-secondary: #757575;
            --bg-light: #f0f2f5;
            --bg-white: #ffffff;
            --border-color: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            height: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--bg-white);
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 50px auto;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tab-menu {
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-white);
            flex-shrink: 0;
        }
        
        .tab-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #9e9e9e; font-size: 0.8em; flex: 1; padding: 5px 0; }
        .tab-item i { font-size: 1.4em; margin-bottom: 4px; }
        .tab-item.active { color: var(--primary-color); }

        .content-card { background: var(--bg-white); border-radius: 12px; margin-bottom: 15px; padding: 15px; border: 1px solid var(--border-color); }
        .content-card h3 { margin: 0 0 15px 0; font-size: 1.1em; color: var(--text-primary); }

        .indices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .index-item {
            background-color: var(--bg-light);
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
        }
        
        .index-name { font-size: 0.8em; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
        .index-price { font-size: 0.95em; font-weight: 700; color: var(--text-primary); }
        .index-change { font-size: 0.75em; margin-top: 2px; font-weight: 500; }
        .index-change.positive { color: var(--positive-color); }
        .index-change.negative { color: var(--negative-color); }

        .watchlist-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .watchlist-item:last-child { border-bottom: none; }
        .stock-info { flex-grow: 1; }
        .stock-info .name { font-weight: 500; color: var(--text-primary); }
        .stock-info .code { font-size: 0.8em; color: var(--text-secondary); }
        .stock-price { text-align: right; min-width: 120px; }
        .stock-price .price { font-weight: 500; font-size: 1.1em; }
        .stock-price .change { font-size: 0.9em; }
        .stock-price .positive { color: var(--positive-color); }
        .stock-price .negative { color: var(--negative-color); }

        .watchlist-controls { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .mode-button { background-color: var(--bg-light); color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
        .mode-button.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .move-controls { display: flex; gap: 5px; margin-left: 10px; }
        .move-arrow-btn { background: none; border: 1px solid var(--border-color); border-radius: 4px; padding: 5px 8px; cursor: pointer; color: var(--text-secondary); font-size: 0.9em; }
        .move-arrow-btn.hidden { opacity: 0; pointer-events: none; }
        .delete-checkbox { margin-left: 15px; width: 20px; height: 20px; cursor: pointer; }

        .delete-actions, .move-actions { display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .action-button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: 500; }
        .action-button.primary { background-color: var(--primary-color); color: white; }
        .action-button.secondary { background-color: var(--bg-light); color: var(--text-primary); border: 1px solid var(--border-color); }

        .add-stock-form { position: relative; margin-top: 15px; }
        #stock-search-input { width: 100%; box-sizing: border-box; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; font-size: 1em; }
        .search-results-dropdown { position: absolute; background-color: var(--bg-white); border: 1px solid var(--border-color); border-radius: 8px; max-height: 200px; overflow-y: auto; width: 100%; z-index: 1000; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: none; margin-top: 5px; }
        .search-results-dropdown.show { display: block; }
        .search-result-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background-color: #f0f0f0; }

        .portfolio-member { margin-bottom: 10px; }
        .portfolio-member-header { background: #f5f5f5; padding: 10px 15px; border-radius: 8px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .portfolio-content { display: none; padding: 10px; border: 1px solid #f5f5f5; border-top: none; border-radius: 0 0 8px 8px; }
        .portfolio-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .portfolio-table th, .portfolio-table td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .portfolio-table th { font-weight: 500; color: var(--text-secondary); }
        .portfolio-table td { color: var(--text-primary); }
        .portfolio-table .align-right { text-align: right; white-space: nowrap; }
        .portfolio-table .actions { width: 40px; text-align: right; }
        .portfolio-table .quantity-input { width: 95px; text-align: right; border: 1px solid #ddd; border-radius: 4px; padding: 4px; font-size: 0.9em; box-sizing: border-box; }

        .portfolio-account { margin-bottom: 8px; }
        .account-header { background: #fafafa; padding: 8px 12px; border-radius: 6px; font-weight: normal; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.95em; }
        .account-content { display: none; padding: 10px 5px 0 5px; }

        .status-table-container { overflow-x: auto; }
        .status-table { width: 100%; border-collapse: collapse; font-size: 0.85em; min-width: 300px; }
        .status-table th, .status-table td { padding: 10px 5px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .status-table th { background-color: #fafafa; }
    </style>
</head>
<body>
    <div class="container">
        <main class="content">
            <div class="loading-spinner"></div>
        </main>

        <nav class="tab-menu">
            <a href="#" class="tab-item active" data-tab="home"><i class="fas fa-home"></i><span>홈</span></a>
            <a href="#" class="tab-item" data-tab="watchlist"><i class="fas fa-star"></i><span>관심종목</span></a>
            <a href="#" class="tab-item" data-tab="portfolio"><i class="fas fa-users"></i><span>가족 포트폴리오</span></a>
            <a href="#" class="tab-item" data-tab="status"><i class="fas fa-chart-line"></i><span>투자현황</span></a>
        </nav>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const contentEl = document.querySelector('.content');
            const tabs = document.querySelectorAll('.tab-item');

            const USER_ID = "family_main_account"; 
            let appData = {};

            const defaultData = {
                family_portfolio: {
                    "장병찬": {
                        "DC": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "솔미채", "code": "490490", "quantity": 0, "dividend": 0}
                        ],
                        "ISA": [
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0},
                            {"name": "코차휴", "code": "0048K0", "quantity": 0, "dividend": 0}
                        ],
                        "연금_회사": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ],
                        "연금_개인": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ],
                        "IRP": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0},
                            {"name": "솔미채", "code": "490490", "quantity": 0, "dividend": 0}
                        ],
                        "금&코인": [
                            {"name": "KRX 금현물", "code": "KRX_GOLD_1G", "quantity": 0, "dividend": 0},
                            {"name": "비트코인", "code": "BTC-KRW", "quantity": 0, "dividend": 0}
                        ]
                    },
                    "한양자": {
                        "연금저축": [
                            {"name": "타미당", "code": "458730", "quantity": 80, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ],
                        "ISA": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ]
                    },
                    "장가연": {
                        "연금저축": [
                            {"name": "타미당", "code": "458730", "quantity": 30, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ],
                        "ISA": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ]
                    },
                    "장세훈": {
                        "연금저축": [
                            {"name": "타미당", "code": "458730", "quantity": 40, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ],
                        "ISA": [
                            {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                            {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                        ]
                    }
                },
                watchlist: ["005930", "AAPL", "MSFT", "035420"]
            };

            const targetRatios = {
                "타미당": 35,
                "코나백": 25,
                "솔미채": 10,
                "코차휴": 10,
                "KRX 금현물": 5,
                "비트코인": 15
            };

            const stockNameMap = {
                "247540": "에코프로비엠",
                "005930": "삼성전자",
                "000660": "SK하이닉스",
                "035420": "NAVER",
                "035720": "카카오",
                "379810": "KODEX 미국배당다우존스",
                "458730": "TIGER 미국배당다우존스",
                "490490": "ACE 미국배당다우존스",
                "0048K0": "TIGER 미국S&P500",
                "AAPL": "애플",
                "MSFT": "마이크로소프트",
                "GOOGL": "구글",
                "AMZN": "아마존",
                "NVDA": "엔비디아",
                "TSLA": "테슬라",
                "^KS11": "코스피",
                "^KQ11": "코스닥",
                "USDKRW=X": "원달러 환율",
                "KRX_GOLD_1G": "KRX 금현물",
                "BTC-KRW": "비트코인"
            };

            async function loadData() {
                try {
                    const res = await fetch(`/api/load-data/${USER_ID}`);
                    if (!res.ok) throw new Error("데이터 로드 실패");
                    const data = await res.json();
                    
                    if (!data.watchlist || (data.watchlist.length === 0 && (!data.family_portfolio || Object.keys(data.family_portfolio).length === 0))) {
                        appData = JSON.parse(JSON.stringify(defaultData));
                        await saveData(); 
                    } else {
                        appData = data;
                        
                        if (!appData.family_portfolio) appData.family_portfolio = {};
                        ["한양자", "장가연", "장세훈"].forEach(member => {
                            if (!appData.family_portfolio[member] || appData.family_portfolio[member]["국내주식"] || appData.family_portfolio[member]["해외주식"]) {
                                appData.family_portfolio[member] = {
                                    "연금저축": [
                                        {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                                        {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                                    ],
                                    "ISA": [
                                        {"name": "타미당", "code": "458730", "quantity": 0, "dividend": 0},
                                        {"name": "코나백", "code": "379810", "quantity": 0, "dividend": 0}
                                    ]
                                };
                            }
                        });
                    }
                } catch (e) {
                    console.error(e);
                    appData = JSON.parse(JSON.stringify(defaultData));
                }
            }

            async function saveData() {
                try {
                    await fetch(`/api/save-data/${USER_ID}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(appData)
                    });
                } catch (e) {
                    console.error("데이터 저장 실패:", e);
                }
            }

            function getStockQuantity(memberName, stockName) {
                const memberObj = appData.family_portfolio?.[memberName] || {};
                let total = 0;
                Object.values(memberObj).flat().forEach(s => {
                    if (s.name === stockName) {
                        total += (s.quantity || 0);
                    }
                });
                return total;
            }

            const formatCurrency = (value) => `₩ ${Math.round(value).toLocaleString('ko-KR', { maximumFractionDigits: 0 })}`;
            const formatNumber = (value) => {
                if (value === undefined || value === null || isNaN(value)) return '0';
                return Number(value).toLocaleString('ko-KR', { maximumFractionDigits: 8 });
            };
            const showLoading = () => contentEl.innerHTML = '<div class="loading-spinner"></div>';
            
            let stockDataCache = {};

            function formatCodeForApi(code) {
                // 수정된 부분: 코드를 변형하지 않고 그대로 백엔드로 전달합니다.
                return code;
            }

            async function fetchStockData(codes, forceRefresh = false) {
                const uniqueCodes = [...new Set(codes)];
                if (uniqueCodes.length === 0) return {};

                const apiCodes = uniqueCodes.map(c => formatCodeForApi(c));

                try {
                    const response = await fetch('/api/stock-prices', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codes: apiCodes, force_refresh: forceRefresh })
                    });
                    if (!response.ok) throw new Error('Network response was not ok');
                    
                    const data = await response.json();
                    
                    for (let i = 0; i < uniqueCodes.length; i++) {
                        const originalCode = uniqueCodes[i];
                        const apiCode = apiCodes[i];
                        if (data[apiCode]) {
                            stockDataCache[originalCode] = data[apiCode];
                        }
                    }
                    return stockDataCache;
                } catch (error) {
                    return stockDataCache;
                }
            }

            async function renderHome() {
                const jangPortfolio = appData.family_portfolio?.["장병찬"] || {};
                const allMyStockCodes = Object.values(jangPortfolio).flat().map(s => s.code);
                if (!allMyStockCodes.includes('KRX_GOLD_1G')) {
                    allMyStockCodes.push('KRX_GOLD_1G');
                }

                const prices = await fetchStockData(allMyStockCodes);

                const targetOrder = ["타미당", "코나백", "솔미채", "코차휴", "KRX 금현물", "비트코인"];
                const stockSummary = {};

                targetOrder.forEach(name => {
                    stockSummary[name] = { name, code: '', quantity: 0, value: 0, targetRatio: targetRatios[name] || 0 };
                });

                Object.values(jangPortfolio).flat().forEach(stock => {
                    if (!stockSummary[stock.name]) {
                        stockSummary[stock.name] = { name: stock.name, code: stock.code, quantity: 0, value: 0, targetRatio: targetRatios[stock.name] || 0 };
                    }
                    stockSummary[stock.name].code = stock.code;
                    stockSummary[stock.name].quantity += stock.quantity;
                });

                let totalPortfolioValue = 0;
                Object.values(stockSummary).forEach(item => {
                    const unitPrice = prices[item.code]?.price || 0;
                    item.value = unitPrice * item.quantity;
                    totalPortfolioValue += item.value;
                });

                let html = `
                    <div style="text-align: center; margin-bottom: 15px; padding: 10px 0 5px 0;">
                        <h2 style="margin: 0; font-size: 1.25em; color: var(--primary-color); font-weight: 700;">
                            <i class="fas fa-chart-pie" style="margin-right: 6px;"></i>우리 가족 자산 대시보드
                        </h2>
                        <p style="margin: 4px 0 0 0; font-size: 0.8em; color: var(--text-secondary);">가족 자산 현황과 투자 목표를 한눈에 관리하세요</p>
                    </div>
                    <div class="content-card">
                        <div class="status-table-container">
                            <table class="status-table">
                                <thead>
                                    <tr>
                                        <th style="text-align: left;">종목명</th>
                                        <th style="text-align: right;">보유수량</th>
                                        <th style="text-align: right;">현재 비율</th>
                                        <th style="text-align: right;">목표 비율</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                const sortedList = Object.values(stockSummary).sort((a, b) => {
                    return targetOrder.indexOf(a.name) - targetOrder.indexOf(b.name);
                });

                sortedList.forEach(item => {
                    const currentRatio = totalPortfolioValue > 0 ? (item.value / totalPortfolioValue) * 100 : 0;
                    html += `
                        <tr>
                            <td style="text-align: left; font-weight: 500;">${item.name}</td>
                            <td style="text-align: right;">${formatNumber(item.quantity)}</td>
                            <td style="text-align: right; font-weight: 700; color: var(--primary-color);">${currentRatio.toFixed(1)}%</td>
                            <td style="text-align: right; color: var(--text-secondary);">${item.targetRatio}%</td>
                        </tr>`;
                });

                html += `</tbody></table></div></div>`;

                const targetPerPerson = 30000;
                const jangTamidang = getStockQuantity("장병찬", "타미당");
                const hanTamidang = getStockQuantity("한양자", "타미당");
                
                html += `
                    <div class="content-card">
                        <h3>타미당 보유 현황 (목표 : 각 3만주)</h3>
                        <div class="status-table-container">
                            <table class="status-table">
                                <thead>
                                    <tr>
                                        <th style="text-align: left;">구분</th>
                                        <th style="text-align: right;">보유 수량</th>
                                        <th style="text-align: right;">남은 수량</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td style="text-align: left;">장병찬</td>
                                        <td style="text-align: right;">${formatNumber(jangTamidang)}주</td>
                                        <td style="text-align: right; color: var(--positive-color); font-weight: 500;">${formatNumber(targetPerPerson - jangTamidang)}주</td>
                                    </tr>
                                    <tr>
                                        <td style="text-align: left;">한양자</td>
                                        <td style="text-align: right;">${formatNumber(hanTamidang)}주</td>
                                        <td style="text-align: right; color: var(--positive-color); font-weight: 500;">${formatNumber(targetPerPerson - hanTamidang)}주</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                contentEl.innerHTML = html;
            }

            let watchlistMode = 'normal';
            let selectedForDeletion = new Set();

            async function renderWatchlist() {
                const indexCodes = ['^KS11', '^KQ11', 'USDKRW=X', 'KRX_GOLD_1G'];
                const allWatchlistCodes = [...indexCodes, ...appData.watchlist];
                const prices = await fetchStockData(allWatchlistCodes, true);

                const indexConfig = [
                    { code: '^KS11', label: '코스피' },
                    { code: '^KQ11', label: '코스닥' },
                    { code: 'USDKRW=X', label: '환율(USD)' },
                    { code: 'KRX_GOLD_1G', label: 'KRX 금(1g)' }
                ];

                let html = `
                    <div class="content-card">
                        <h3>주요 지수</h3>
                        <div class="indices-grid">`;

                indexConfig.forEach(item => {
                    const data = prices[item.code] || { price: 0, change: 0, change_percent: 0 };
                    const changeClass = data.change >= 0 ? 'positive' : 'negative';
                    const sign = data.change >= 0 ? '+' : '';
                    let priceFormatted = data.price ? data.price.toLocaleString('ko-KR', { minimumFractionDigits: 2 }) : '-';

                    html += `
                        <div class="index-item" data-code="${item.code}">
                            <div class="index-name">${item.label}</div>
                            <div class="index-price">${priceFormatted}</div>
                            <div class="index-change ${changeClass}">
                                ${sign}${data.change ? data.change.toFixed(2) : '0.00'} (${sign}${data.change_percent ? data.change_percent.toFixed(2) : '0.00'}%)
                            </div>
                        </div>`;
                });

                html += `</div></div>
                    <div class="content-card">
                        <h3>관심 종목</h3>
                        <div id="watchlist-items">
                            <div class="watchlist-controls">
                                <button id="toggle-move-mode" class="mode-button ${watchlistMode === 'move' ? 'active' : ''}">이동</button>
                                <button id="toggle-delete-mode" class="mode-button ${watchlistMode === 'delete' ? 'active' : ''}">지우기</button>
                            </div>`;
                
                appData.watchlist.forEach((code, index) => {
                    const stock = prices[code] || {};
                    const displayName = stock.name || stockNameMap[code] || code;

                    const changeClass = stock.change >= 0 ? 'positive' : 'negative';
                    const sign = stock.change >= 0 ? '+' : '';

                    let rightSideControls = '';
                    if (watchlistMode === 'move') {
                        rightSideControls = `
                            <div class="move-controls">
                                <button class="move-arrow-btn move-up ${index === 0 ? 'hidden' : ''}" data-code="${code}"><i class="fas fa-arrow-up"></i></button>
                                <button class="move-arrow-btn move-down ${index === appData.watchlist.length - 1 ? 'hidden' : ''}" data-code="${code}"><i class="fas fa-arrow-down"></i></button>
                            </div>`;
                    } else if (watchlistMode === 'delete') {
                        const isChecked = selectedForDeletion.has(code) ? 'checked' : '';
                        rightSideControls = `<input type="checkbox" class="delete-checkbox" data-code="${code}" ${isChecked}>`;
                    }

                    html += `
                        <div class="watchlist-item" data-code="${code}"> 
                            <div class="stock-info">
                                <div class="name">${displayName}</div>
                                <div class="code">${code}</div>
                            </div>
                            <div class="stock-price">
                                <div class="price">${formatCurrency(stock.price || 0)}</div>
                                <div class="change ${changeClass}">${sign}${formatCurrency(stock.change || 0)} (${(stock.change_percent || 0).toFixed(2)}%)</div>
                            </div>
                            ${rightSideControls}
                        </div>`;
                });

                if (watchlistMode === 'move') {
                    html += `<div class="move-actions"><button id="done-move-btn" class="action-button primary">완료</button></div>`;
                } else if (watchlistMode === 'delete') {
                    html += `<div class="delete-actions"><button id="confirm-delete-btn" class="action-button primary">확인</button><button id="cancel-delete-btn" class="action-button secondary">취소</button></div>`;
                }

                html += `</div></div>
                    <div class="content-card">
                        <h3>관심 종목 추가</h3> 
                        <div class="add-stock-form">
                            <input type="text" id="stock-search-input" placeholder="종목명 검색" autocomplete="off">
                            <div id="search-results" class="search-results-dropdown"></div>
                        </div>
                    </div>`;
                contentEl.innerHTML = html;
                setupWatchlistEventListeners();
            }

            function setupWatchlistEventListeners() {
                const toggleMoveBtn = document.getElementById('toggle-move-mode');
                const toggleDeleteBtn = document.getElementById('toggle-delete-mode');

                if (toggleMoveBtn) {
                    toggleMoveBtn.onclick = () => {
                        watchlistMode = watchlistMode === 'move' ? 'normal' : 'move';
                        selectedForDeletion.clear();
                        renderWatchlist();
                    };
                }

                if (toggleDeleteBtn) {
                    toggleDeleteBtn.onclick = () => {
                        watchlistMode = watchlistMode === 'delete' ? 'normal' : 'delete';
                        selectedForDeletion.clear();
                        renderWatchlist();
                    };
                }

                document.querySelectorAll('.move-up').forEach(btn => {
                    btn.onclick = async () => {
                        const code = btn.dataset.code;
                        const idx = appData.watchlist.indexOf(code);
                        if (idx > 0) {
                            const temp = appData.watchlist[idx];
                            appData.watchlist[idx] = appData.watchlist[idx - 1];
                            appData.watchlist[idx - 1] = temp;
                            await saveData();
                            renderWatchlist();
                        }
                    };
                });

                document.querySelectorAll('.move-down').forEach(btn => {
                    btn.onclick = async () => {
                        const code = btn.dataset.code;
                        const idx = appData.watchlist.indexOf(code);
                        if (idx < appData.watchlist.length - 1) {
                            const temp = appData.watchlist[idx];
                            appData.watchlist[idx] = appData.watchlist[idx + 1];
                            appData.watchlist[idx + 1] = temp;
                            await saveData();
                            renderWatchlist();
                        }
                    };
                });

                const doneMoveBtn = document.getElementById('done-move-btn');
                if (doneMoveBtn) {
                    doneMoveBtn.onclick = () => {
                        watchlistMode = 'normal';
                        renderWatchlist();
                    };
                }

                document.querySelectorAll('.delete-checkbox').forEach(chk => {
                    chk.onchange = (e) => {
                        const code = e.target.dataset.code;
                        if (e.target.checked) selectedForDeletion.add(code);
                        else selectedForDeletion.delete(code);
                    };
                });

                const confirmDeleteBtn = document.getElementById('confirm-delete-btn');
                if (confirmDeleteBtn) {
                    confirmDeleteBtn.onclick = async () => {
                        appData.watchlist = appData.watchlist.filter(code => !selectedForDeletion.has(code));
                        selectedForDeletion.clear();
                        watchlistMode = 'normal';
                        await saveData();
                        renderWatchlist();
                    };
                }

                const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
                if (cancelDeleteBtn) {
                    cancelDeleteBtn.onclick = () => {
                        selectedForDeletion.clear();
                        watchlistMode = 'normal';
                        renderWatchlist();
                    };
                }

                const searchInput = document.getElementById('stock-search-input');
                const searchResults = document.getElementById('search-results');
                if (searchInput) {
                    let searchTimeout;
                    searchInput.oninput = (e) => {
                        clearTimeout(searchTimeout);
                        const query = e.target.value.trim();
                        if (!query) {
                            searchResults.classList.remove('show');
                            return;
                        }
                        searchTimeout = setTimeout(async () => {
                            try {
                                const res = await fetch(`/api/search-stock?query=${encodeURIComponent(query)}`);
                                const items = await res.json();
                                if (items && items.length > 0) {
                                    searchResults.innerHTML = items.map(item => {
                                        return `
                                            <div class="search-result-item" data-code="${item.code}" data-name="${item.name}">
                                                <span>${item.name}</span><small>${item.code}</small>
                                            </div>
                                        `;
                                    }).join('');
                                    searchResults.classList.add('show');

                                    searchResults.querySelectorAll('.search-result-item').forEach(el => {
                                        el.onclick = async () => {
                                            const code = el.dataset.code;
                                            if (!appData.watchlist.includes(code)) {
                                                appData.watchlist.push(code);
                                                await saveData();
                                            }
                                            searchInput.value = '';
                                            searchResults.classList.remove('show');
                                            renderWatchlist();
                                        };
                                    });
                                } else {
                                    searchResults.innerHTML = '<div class="search-result-item">검색 결과가 없습니다.</div>';
                                    searchResults.classList.add('show');
                                }
                            } catch (err) {
                                searchResults.classList.remove('show');
                            }
                        }, 300);
                    };
                }
            }

            async function renderPortfolioStockTable(stocks, member, accountName, prices) {
                let tableHtml = `<table class="portfolio-table"><thead><tr><th>종목명</th><th class="align-right">보유량</th><th class="align-right">평가액</th></tr></thead><tbody>`;

                stocks.forEach(stock => {
                    const unitPrice = prices[stock.code]?.price || 0;
                    const totalValue = unitPrice * stock.quantity;
                    const quantityDisplay = `<input type="text" class="quantity-input" value="${formatNumber(stock.quantity)}" data-member="${member}" data-account="${accountName}" data-code="${stock.code}" data-price="${unitPrice}">`;

                    tableHtml += `
                        <tr data-code="${stock.code}">
                            <td>${stock.name}<br><small>${stock.code}</small></td>
                            <td class="align-right">${quantityDisplay}</td>
                            <td class="align-right stock-total-value">${formatCurrency(totalValue)}</td>
                        </tr>`;
                });
                tableHtml += `</tbody></table>`;
                return tableHtml;
            }

            async function renderPortfolio() {
                const allPortfolioCodes = Object.values(appData.family_portfolio)
                    .flatMap(m => Object.values(m).flat())
                    .map(s => s.code);
                const prices = await fetchStockData(allPortfolioCodes);

                const memberOrder = ["장병찬", "한양자", "장가연", "장세훈"];

                let html = '<div class="content-card"><h3>가족 포트폴리오</h3>';
                
                const sortedMembers = Object.keys(appData.family_portfolio).sort((a, b) => {
                    return memberOrder.indexOf(a) - memberOrder.indexOf(b);
                });

                for (const member of sortedMembers) {
                    const memberAccounts = appData.family_portfolio[member];
                    html += `
                        <div class="portfolio-member">
                            <div class="portfolio-member-header"><span>${member}</span><i class="fas fa-chevron-down"></i></div>
                            <div class="portfolio-content">`;
                    
                    const aggregatedStocks = {};
                    const stockOrderMap = member === "장병찬" 
                        ? ["타미당", "코나백", "솔미채", "코차휴", "KRX 금현물", "비트코인"]
                        : ["타미당", "코나백"];

                    stockOrderMap.forEach(name => {
                        aggregatedStocks[name] = { name, code: '', quantity: 0 };
                    });

                    Object.values(memberAccounts).forEach(stocks => {
                        stocks.forEach(s => {
                            if (!aggregatedStocks[s.name]) {
                                aggregatedStocks[s.name] = { name: s.name, code: s.code, quantity: 0 };
                            }
                            aggregatedStocks[s.name].code = s.code;
                            aggregatedStocks[s.name].quantity += (s.quantity || 0);
                        });
                    });

                    const totalTabStocks = stockOrderMap.map(name => aggregatedStocks[name]).filter(s => s && s.code);
                    
                    html += `
                        <div class="portfolio-account">
                            <div class="account-header" style="background: #f0ebf8; font-weight: 500; color: var(--primary-color);"><span>전체</span><i class="fas fa-chevron-down"></i></div>
                            <div class="account-content">${await renderPortfolioStockTable(totalTabStocks, member, "__TOTAL__", prices)}</div>
                        `;

                    if (member === "장병찬") {
                        const accountOrder = ["DC", "ISA", "연금_회사", "연금_개인", "IRP", "금&코인"];
                        const sortedAccounts = Object.keys(memberAccounts).sort((a, b) => {
                            let idxA = accountOrder.indexOf(a);
                            let idxB = accountOrder.indexOf(b);
                            if (idxA === -1) idxA = 999;
                            if (idxB === -1) idxB = 999;
                            return idxA - idxB;
                        });

                        for (const accountName of sortedAccounts) {
                            const stocks = memberAccounts[accountName];
                            html += `
                                <div class="portfolio-account">
                                    <div class="account-header"><span>${accountName}</span><i class="fas fa-chevron-down"></i></div>
                                    <div class="account-content">${await renderPortfolioStockTable(stocks, member, accountName, prices)}</div>
                                </div>`;
                        }
                    } else {
                        const accountOrder = ["연금저축", "ISA"];
                        const sortedAccounts = Object.keys(memberAccounts).sort((a, b) => {
                            let idxA = accountOrder.indexOf(a);
                            let idxB = accountOrder.indexOf(b);
                            if (idxA === -1) idxA = 999;
                            if (idxB === -1) idxB = 999;
                            return idxA - idxB;
                        });

                        for (const accountName of sortedAccounts) {
                            const stocks = memberAccounts[accountName];
                            html += `
                                <div class="portfolio-account">
                                    <div class="account-header"><span>${accountName}</span><i class="fas fa-chevron-down"></i></div>
                                    <div class="account-content">${await renderPortfolioStockTable(stocks, member, accountName, prices)}</div>
                                </div>`;
                        }
                    }
                    html += `</div></div>`;
                }
                html += '</div>';
                contentEl.innerHTML = html;
                setupPortfolioEventListeners();
            }

            function setupPortfolioEventListeners() {
                document.querySelectorAll('.portfolio-member-header').forEach(header => {
                    header.onclick = () => {
                        const content = header.nextElementSibling;
                        content.style.display = content.style.display === 'block' ? 'none' : 'block';
                        const icon = header.querySelector('i');
                        icon.className = content.style.display === 'block' ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
                    };
                });

                document.querySelectorAll('.account-header').forEach(header => {
                    header.onclick = (e) => {
                        e.stopPropagation();
                        const content = header.nextElementSibling;
                        content.style.display = content.style.display === 'block' ? 'none' : 'block';
                        const icon = header.querySelector('i');
                        icon.className = content.style.display === 'block' ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
                    };
                });

                document.querySelectorAll('.quantity-input').forEach(input => {
                    let saveTimeout;
                    input.oninput = (e) => {
                        const member = e.target.dataset.member;
                        const account = e.target.dataset.account;
                        const code = e.target.dataset.code;
                        
                        if (account === "__TOTAL__") return;

                        const price = parseFloat(e.target.dataset.price) || 0;
                        const val = parseFloat(e.target.value.replace(/,/g, '')) || 0;

                        const stocks = appData.family_portfolio?.[member]?.[account];
                        if (stocks) {
                            const target = stocks.find(s => s.code === code);
                            if (target) {
                                target.quantity = val;
                                clearTimeout(saveTimeout);
                                saveTimeout = setTimeout(() => {
                                    saveData();
                                }, 500);
                            }
                        }

                        const tr = e.target.closest('tr');
                        const totalValEl = tr.querySelector('.stock-total-value');
                        if (totalValEl) {
                            totalValEl.textContent = formatCurrency(price * val);
                        }
                    };
                });
            }

            async function renderStatus() {
                contentEl.innerHTML = `<div class="content-card"><h3>투자 현황</h3><p>투자 현황 데이터 화면입니다.</p></div>`;
            }

            const tabFunctions = { home: renderHome, watchlist: renderWatchlist, portfolio: renderPortfolio, status: renderStatus };

            tabs.forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const tabName = this.dataset.tab;
                    sessionStorage.setItem('activeTab', tabName);
                    showLoading();
                    tabFunctions[tabName]();
                });
            });

            async function updatePricesSilently() {
                const activeTab = sessionStorage.getItem('activeTab') || 'home';
                let codesToFetch = [];

                if (activeTab === 'home') {
                    const jangPortfolio = appData.family_portfolio?.["장병찬"] || {};
                    codesToFetch = Object.values(jangPortfolio).flat().map(s => s.code);
                    if (!codesToFetch.includes('KRX_GOLD_1G')) codesToFetch.push('KRX_GOLD_1G');
                } else if (activeTab === 'watchlist') {
                    codesToFetch = ['^KS11', '^KQ11', 'USDKRW=X', 'KRX_GOLD_1G', ...appData.watchlist];
                } else if (activeTab === 'portfolio') {
                    codesToFetch = Object.values(appData.family_portfolio)
                        .flatMap(m => Object.values(m).flat())
                        .map(s => s.code);
                }

                if (codesToFetch.length === 0) return;

                const prices = await fetchStockData(codesToFetch, false);

                document.querySelectorAll('.watchlist-item, .index-item, tr[data-code]').forEach(el => {
                    const code = el.dataset.code;
                    if (prices[code]) {
                        const priceEl = el.querySelector('.price, .index-price');
                        const changeEl = el.querySelector('.change, .index-change');
                        const totalValEl = el.querySelector('.stock-total-value');
                        
                        if (priceEl) {
                            if (el.classList.contains('index-item')) {
                                priceEl.textContent = prices[code].price ? prices[code].price.toLocaleString('ko-KR', { minimumFractionDigits: 2 }) : '-';
                            } else {
                                priceEl.textContent = formatCurrency(prices[code].price);
                            }
                        }
                        if (changeEl) {
                            const stock = prices[code];
                            const changeClass = stock.change >= 0 ? 'positive' : 'negative';
                            const sign = stock.change >= 0 ? '+' : '';
                            changeEl.className = `change index-change ${changeClass}`;
                            changeEl.textContent = `${sign}${stock.change ? stock.change.toFixed(2) : '0.00'} (${sign}${stock.change_percent ? stock.change_percent.toFixed(2) : '0.00'}%)`;
                        }
                        if (totalValEl) {
                            const qtyInput = el.querySelector('.quantity-input');
                            const qty = qtyInput ? parseFloat(qtyInput.value.replace(/,/g, '')) || 0 : 0;
                            totalValEl.textContent = formatCurrency(prices[code].price * qty);
                        }
                    }
                });
            }

            let autoUpdateInterval = null;

            async function initialize() {
                await loadData();
                let currentTab = sessionStorage.getItem('activeTab') || 'home';

                tabs.forEach(tab => {
                    if (tab.dataset.tab === currentTab) tab.classList.add('active');
                    else tab.classList.remove('active');
                });

                tabFunctions[currentTab]();

                if (autoUpdateInterval) clearInterval(autoUpdateInterval);
                autoUpdateInterval = setInterval(updatePricesSilently, 2000);
            }

            initialize();
        });
    </script>
</body>
</html>

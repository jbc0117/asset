<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 자산 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
        }
        .main-container { padding: 20px; }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .stock-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f1f3f5;
        }
        .stock-item:last-child { border-bottom: none; }
        .text-red { color: #dc3545 !important; }
        .text-blue { color: #0d6efd !important; }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .nav-item.active { color: #6f42c1; }
        .nav-item i {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 주요 지수 섹션 -->
        <div class="card p-3">
            <h5 class="mb-3 fw-bold">주요 지수</h5>
            <div class="row g-2" id="market-indices"></div>
        </div>

        <!-- 관심 종목 섹션 -->
        <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">관심 종목</h5>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-edit"><i class="fa-solid fa-arrow-up-wide-short"></i> 이동</button>
                    <button class="btn btn-sm btn-outline-secondary" id="btn-delete"><i class="fa-solid fa-trash"></i> 지우기</button>
                </div>
            </div>
            <div id="watchlist-container"></div>
        </div>
    </div>

    <!-- 하단 네비게이션바 -->
    <div class="bottom-nav">
        <a href="/" class="nav-item active"><i class="fa-solid fa-house"></i>홈</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-star"></i>관심종목</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user-group"></i>가족 포트폴리오</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-chart-line"></i>투자현황</a>
    </div>

    <script>
        let watchlistCodes = ["005930", "000660", "035420"];

        async function fetchStockPrices() {
            try {
                const response = await fetch('/api/stock-prices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codes: watchlistCodes })
                });
                const data = await response.json();
                renderWatchlist(data);
            } catch (error) {
                console.error("주식 시세 조회 실패:", error);
            }
        }

        function renderWatchlist(stockData) {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = '';

            watchlistCodes.forEach(code => {
                const stock = stockData[code];
                if (!stock) return;

                const isPlus = stock.change >= 0;
                const changeColor = isPlus ? 'text-red' : 'text-blue';
                const signSymbol = isPlus ? '+' : '';

                const html = `
                    <div class="stock-item">
                        <div>
                            <!-- 큰 글씨로 한글 이름 표시 -->
                            <div class="fw-bold fs-5">${stock.name}</div>
                            <div class="text-muted small">${stock.code}</div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold fs-5">₩ ${stock.price.toLocaleString()}</div>
                            <div class="${changeColor} small">
                                ${signSymbol}₩ ${stock.change.toLocaleString()} (${signSymbol}${stock.change_percent.toFixed(2)}%)
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        fetchStockPrices();
        setInterval(fetchStockPrices, 10000);
    </script>
</body>
</html>
